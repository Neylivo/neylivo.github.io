name: deploy

# Сайт Ponoi. Собирается и выкладывается сам:
#   - при изменении в main;
#   - по расписанию, потому что версия и ссылки на файлы берутся из последнего
#     выпуска приложения, а он выходит в ДРУГОМ репозитории и об изменении
#     здесь никто не узнает;
#   - по кнопке;
#   - по сигналу извне (repository_dispatch) — если владелец добавит в
#     репозиторий приложения шаг, который дёргает этот, сайт обновится сразу
#     после выпуска, а не в ближайшую проверку по расписанию.
#
# ПОЧЕМУ БОЛЬШЕ НЕ ЧЕРЕЗ АРТЕФАКТ PAGES (12.08.2026).
#
# Раньше здесь были upload-pages-artifact + deploy-pages. У репозитория при
# этом работал и старый конвейер GitHub Pages — «pages build and deployment»,
# который берёт ветку целиком и прогоняет через Jekyll. Оба запускались на один
# push, и кто заканчивал последним, того и был сайт. Однажды последним закончил
# Jekyll: на ponoiai.github.io оказалась страница, сделанная им из README.md, а
# /about/, /ru/, /download/ и все остальные стали отдавать 404.
#
# Переключить источник Pages может только владелец в настройках, а сайт не
# должен зависеть от галочки, о которой никто не помнит. Поэтому собранный сайт
# кладётся В КОРЕНЬ ветки (publish.mjs) и коммитится: что бы ни выложило
# страницу — наш процесс или чужой, — содержимое одно и то же.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [ponoi-release]

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        # GITHUB_TOKEN — чтобы запрос к GitHub за последним выпуском не упёрся в
        # ограничение для анонимных запросов, когда сборка идёт часто.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build.mjs

      - name: Check the built site
        # Проверка ссылок, заголовков, описаний, JSON-LD и карты сайта. Падение
        # здесь останавливает выкладку: лучше вчерашний сайт, чем сегодняшний
        # со ссылками в никуда.
        run: node check.mjs

      - name: Put the built site at the repository root
        run: node publish.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "ponoi-site"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "сайт не изменился — коммитить нечего"
            exit 0
          fi
          git commit -m "сайт: пересборка (выпуск $(node -p "require('./data/release.json').version"))"
          git push
